<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ローカルログインページ（LocalStorage）</title>
  <style>
    :root{font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
    body{background:#f4f6f8;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 6px 20px rgba(20,30,40,0.08);width:420px}
    h1{font-size:18px;margin:0 0 12px}
    label{display:block;font-size:13px;margin-top:10px}
    input[type=text], input[type=date]{width:100%;padding:10px;border-radius:8px;border:1px solid #e0e6eb;margin-top:6px;font-size:14px}
    .controls{display:flex;gap:8px;margin-top:14px}
    button{flex:1;padding:10px;border-radius:8px;border:0;background:#0066cc;color:#fff;font-weight:600;cursor:pointer}
    button.secondary{background:#efefef;color:#111;border:1px solid #ddd}
    .small{font-size:13px;color:#666;margin-top:10px}
    pre{background:#f7f9fb;padding:12px;border-radius:8px;overflow:auto;font-size:13px}
    .row{display:flex;align-items:center;gap:8px;margin-top:6px}
  </style>
</head>
<body>
  <div class="card">
    <h1>ログイン / プロフィール保存（ローカルストレージ）</h1>

    <form id="profileForm">
      <label for="name">名前（name）</label>
      <input id="name" name="name" type="text" placeholder="例：オホーツク" required />

      <label for="id">ID（id）</label>
      <input id="id" name="id" type="text" placeholder="例：@okhotsk" required />

      <label class="row"><input id="car" name="car" type="checkbox" /> 車を持っている（car）</label>

      <label for="register">登録日（register）</label>
      <input id="register" name="register" type="date" />

      <div class="controls">
        <button id="saveBtn" type="submit">保存</button>
        <button id="loadBtn" type="button" class="secondary">読み込み</button>
      </div>

      <div class="controls">
        <button id="fillSample" type="button" class="secondary">サンプルを挿入</button>
        <button id="clearBtn" type="button" class="secondary">クリア</button>
      </div>

      <p class="small">保存はブラウザのローカルストレージに行われます。別のブラウザやプライベートモードでは共有されません。</p>
    </form>

    <h2 style="font-size:14px;margin-top:12px">現在の保存データ</h2>
    <pre id="savedData">（まだ保存されていません）</pre>
  </div>

  <script>
    const KEY = 'userProfile'
    const form = document.getElementById('profileForm')
    const savedPre = document.getElementById('savedData')
    const nameInput = document.getElementById('name')
    const idInput = document.getElementById('id')
    const carInput = document.getElementById('car')
    const registerInput = document.getElementById('register')

    function formatDateForInput(yyyymmdd){
      // 例: 20251018 を date input の value に変換 -> 2025-10-18
      if (!yyyymmdd) return ''
      const s = String(yyyymmdd)
      if (s.length === 8) return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`
      return ''
    }

    function showSaved(){
      const raw = localStorage.getItem(KEY)
      if (!raw){ savedPre.textContent = '（まだ保存されていません）'; return }
      try{
        const obj = JSON.parse(raw)
        // 表示用に整形
        savedPre.textContent = JSON.stringify(obj, null, 2)
      }catch(e){ savedPre.textContent = '（保存データが壊れています）' }
    }

    function loadToForm(){
      const raw = localStorage.getItem(KEY)
      if (!raw) return false
      try{
        const obj = JSON.parse(raw)
        nameInput.value = obj.name || ''
        idInput.value = obj.id || ''
        carInput.checked = !!obj.car
        // register が YYYYMMDD 形式で保存されている場合に対応
        if (obj.register){
          // すでに YYYY-MM-DD 形式ならそのまま入れる
          if (/^\d{4}-\d{2}-\d{2}$/.test(obj.register)) registerInput.value = obj.register
          else registerInput.value = formatDateForInput(obj.register)
        } else {
          registerInput.value = ''
        }
        return true
      }catch(e){ return false }
    }

    form.addEventListener('submit', e =>{
      e.preventDefault()
      const payload = {
        name: nameInput.value.trim(),
        id: idInput.value.trim(),
        car: carInput.checked,
        // date input の値を YYYYMMDD の形で保存しておく（要求された形式に近づける）
        register: registerInput.value ? registerInput.value.replace(/-/g, '') : ''
      }
      try{
        localStorage.setItem(KEY, JSON.stringify(payload))
        showSaved()
        alert('保存しました。')
      }catch(err){
        alert('保存に失敗しました: ' + err.message)
      }
    })

    document.getElementById('loadBtn').addEventListener('click', ()=>{
      const ok = loadToForm()
      if (!ok) alert('保存データが見つかりません。')
      else alert('フォームに読み込みました。')
    })

    document.getElementById('clearBtn').addEventListener('click', ()=>{
      if (!confirm('ローカルストレージの保存を削除しますか？')) return
      localStorage.removeItem(KEY)
      nameInput.value = ''
      idInput.value = ''
      carInput.checked = false
      registerInput.value = ''
      showSaved()
    })

    document.getElementById('fillSample').addEventListener('click', ()=>{
      // ユーザーが提示したサンプルデータをフォームに入れる
      const sample = { name: 'オホーツク', id: '@okhotsk', car: true, register: '20251018' }
      nameInput.value = sample.name
      idInput.value = sample.id
      carInput.checked = sample.car
      registerInput.value = formatDateForInput(sample.register)
    })

    // 初期表示
    showSaved()
    // 自動的にフォームに読み込む（あれば）
    loadToForm()
  </script>
</body>
</html>
