<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>のりとも</title>
    <meta
      name="description"
      content="大学内ライドシェアを補助するアプリのデモページ"
    />
    <!-- 共通スタイルシートの読み込み -->
    <link rel="stylesheet" href="../main.css" />
    <!-- ページ固有スタイルを分離 -->
    <link rel="stylesheet" href="friends.css" />
    <!-- ポップアップ用スタイルを分離 -->
    <link rel="stylesheet" href="add-friend.css" />
    <link rel="stylesheet" href="requests.css" />
  </head>
  <body>
    <!-- 共通ヘッダー（全ページに含める） -->
    

    <!-- ページ固有のコンテンツ -->
    <main id="content" role="main">
      <!-- ...existing code... -->
      <section id="friends-section">
        <div class="title-row">
          <div class="ti">
            <h2>👤　フレンド一覧</h2>
          </div>
          <!-- 右側のボタン群 -->
          <div class="actions">
            <button id="check-requests" class="friend-request" type="button" aria-label="フレンド申請確認">フレンド申請確認</button>
            <button
              id="open-add-friend"
              class="add-friend"
              type="button"
              aria-haspopup="dialog"
              aria-controls="add-friend-dialog"
            >
              フレンド追加
            </button>
            <button class="btn-alert">🔔</button>
          </div>
        </div>

        <div class="controls" role="search" aria-label="フレンド検索">
          <input id="friend-search" type="search" placeholder="ID または 名前で検索" aria-label="ID または 名前で検索" />
          <button id="clear-search" type="button" aria-label="検索クリア">クリア</button>
        </div>

        <!-- 表示切替トグル（すべて / ドライバー） -->
        <div class="filter-toggle" role="tablist" aria-label="表示切替">
          <button class="toggle-btn active" data-view="all" aria-pressed="true">すべて</button>
          <button class="toggle-btn" data-view="drivers" aria-pressed="false">ドライバー</button>
        </div>

        <ul id="friends-list" class="friend-list" role="list" aria-live="polite">
          <!-- JSで描画 -->
        </ul>

        <!-- テンプレート -->
        <template id="friend-item-tpl">
          <li class="friend-item" data-id="">
            <div class="friend-info">
              <div class="friend-name">
                <span class="name-text"></span>
                <span class="driver-badge" aria-hidden="true"></span>
              </div>
              <div class="friend-id"></div>
            </div>
            <!-- ドライバー判定は読み取り専用のバッジで表示（切替スイッチは廃止） -->
          </li>
        </template>
        <!-- ポップアップフォーム（入力欄 + 送信/キャンセル） -->
        <dialog id="add-friend-dialog" aria-labelledby="add-friend-title" aria-modal="true">
          <form method="dialog" id="add-friend-form">
            <h3 id="add-friend-title">フレンド申請</h3>
            <label for="new-friend-id">フレンドID / 学内メール</label>
            <input id="new-friend-id" name="friendId" type="text" inputmode="text" required />
            <div class="dialog-actions">
              <button type="button" id="cancel-add-friend">キャンセル</button>
              <button type="submit" id="submit-add-friend">送信</button>
            </div>
          </form>
        </dialog>
        <!-- フォールバックオーバーレイ（dialog 未対応用） -->
        <div id="modal-fallback-overlay" class="modal-fallback-overlay" aria-hidden="true">
          <div class="fallback-inner" role="dialog" aria-modal="true" aria-labelledby="add-friend-title">
            <!-- 内容はダイアログフォームと同一。JSで値を同期するため空の容器を用意 -->
            <form id="add-friend-form-fallback">
              <h3 id="add-friend-title-fb" class="visually-hidden">フレンド申請</h3>
              <label for="new-friend-id-fb" class="visually-hidden">フレンドID</label>
              <input id="new-friend-id-fb" name="friendIdFb" type="text" inputmode="text" required />
              <div class="dialog-actions">
                <button type="button" id="cancel-add-friend-fb">キャンセル</button>
                <button type="button" id="submit-add-friend-fb">送信</button>
              </div>
            </form>
          </div>
        </div>

        <!-- 申請確認ダイアログ（タブ切替：申請中 / 被申請中） -->
        <dialog id="requests-dialog" aria-labelledby="requests-title" aria-modal="true">
          <div class="requests-dialog-inner">
            <h3 id="requests-title">フレンド申請一覧</h3>
            <div class="requests-tabs" role="tablist" aria-label="申請タブ">
              <button class="req-tab active" data-view="sent" aria-pressed="true" role="tab">申請中</button>
              <button class="req-tab" data-view="received" aria-pressed="false" role="tab">被申請中</button>
            </div>
            <ul id="requests-list" class="requests-list" role="list" aria-live="polite">
              <!-- JS で描画 -->
            </ul>
            <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:.5rem;">
              <button type="button" id="close-requests">閉じる</button>
            </div>
          </div>
        </dialog>

        <!-- 申請確認フォールバックオーバーレイ（dialog 未対応時） -->
        <div id="requests-fallback-overlay" class="modal-fallback-overlay" aria-hidden="true">
          <div class="fallback-inner" role="dialog" aria-modal="true" aria-labelledby="requests-title">
            <h3 id="requests-title-fb" class="visually-hidden">フレンド申請一覧</h3>
            <div class="requests-tabs" role="tablist" aria-label="申請タブ">
              <button class="req-tab active" data-view="sent" aria-pressed="true">申請中</button>
              <button class="req-tab" data-view="received" aria-pressed="false">被申請中</button>
            </div>
            <ul id="requests-list-fb" class="requests-list" role="list" aria-live="polite">
              <!-- JS で描画 -->
            </ul>
            <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:.5rem;">
              <button type="button" id="close-requests-fb">閉じる</button>
            </div>
          </div>
        </div>
      </section>
      <!-- ...existing code... -->
    </main>


    <!-- 共通フッター（下部スマホナビに置き換え） -->
    <footer id="site-footer" role="contentinfo">

      <nav
        class="mobile-bottom-nav"
        role="navigation"
        aria-label="下部ナビゲーション"
      >
        <a
          class="nav-btn"
          href="../home/home.html"
          data-key="home"
          aria-label="ホーム"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path d="M12 3 2 12h3v8h6v-5h2v5h6v-8h3z" />
          </svg>
          <span class="label">ホーム</span>
        </a>
        <a
          class="nav-btn"
          href="../friends/friends.html"
          data-key="friends"
          aria-label="フレンド"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V20h14v-3.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V20h6v-1.5C23 14.17 18.33 13 16 13z"
            />
          </svg>
          <span class="label">フレンド</span>
        </a>
        <a
          class="nav-btn"
          href="../reserve/reserve.html"
          data-key="bookings"
          aria-label="予約"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path d="M7 10h5v5H7z" opacity=".9" />
            <path
              d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.89-1.99 2L3 21c0 1.1.89 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.11-.9-2-2-2zM19 21H5V8h14v13z"
            />
          </svg>
          <span class="label">予約</span>
        </a>
        <a
          class="nav-btn"
          href="../profile/profile.html"
          data-key="profile"
          aria-label="プロフィール"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"
            />
          </svg>
          <span class="label">プロフィール</span>
        </a>
      </nav>
    </footer>
    <script>
      // 年を自動挿入
      document.getElementById("year")?.textContent = new Date().getFullYear();
    </script>
    <!-- ポップアップ処理を機能ごとに分割 -->
    <script defer src="add-friend.js"></script>
    <script defer src="requests.js"></script>
     <script defer src="friends.js"></script>
   </body>
 </html>
