<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>のりとも</title>
    <meta
      name="description"
      content="大学内ライドシェアを補助するアプリのデモページ"
    />
    <!-- 共通スタイルシートの読み込み -->
    <link rel="stylesheet" href="../main.css" />
    <!-- ページ固有スタイルを分離 -->
    <link rel="stylesheet" href="friends.css" />
    <!-- 必要なら共通スクリプトをここに追加 -->
    <script defer src="main.js"></script>
  </head>
  <body>
    <!-- 共通ヘッダー（全ページに含める） -->
    <header id="site-header" role="banner">
      <div class="container">
        <h1 class="site-title">のりとも</h1>
      </div>
    </header>

    <!-- ページ固有のコンテンツ -->
    <main id="content" role="main">
      <!-- ...existing code... -->
      <section id="friends-section">
        <h2>フレンド一覧</h2>

        <div class="controls" role="search" aria-label="フレンド検索">
          <input id="friend-search" type="search" placeholder="ID または 名前で検索" aria-label="ID または 名前で検索" />
          <button id="clear-search" type="button" aria-label="検索クリア">クリア</button>
        </div>

        <!-- 表示切替トグル（すべて / ドライバー） -->
        <div class="filter-toggle" role="tablist" aria-label="表示切替">
          <button class="toggle-btn active" data-view="all" aria-pressed="true">すべて</button>
          <button class="toggle-btn" data-view="drivers" aria-pressed="false">ドライバー</button>
        </div>

        <ul id="friends-list" class="friend-list" role="list" aria-live="polite">
          <!-- JSで描画 -->
        </ul>

        <!-- テンプレート -->
        <template id="friend-item-tpl">
          <li class="friend-item" data-id="">
            <div class="friend-info">
              <div class="friend-name">
                <span class="name-text"></span>
                <span class="driver-badge" aria-hidden="true"></span>
              </div>
              <div class="friend-id"></div>
            </div>
            <!-- ドライバー判定は読み取り専用のバッジで表示（切替スイッチは廃止） -->
          </li>
        </template>
      </section>
      <!-- ...existing code... -->
    </main>

    <!-- 共通フッター（下部スマホナビに置き換え） -->
    <footer id="site-footer" role="contentinfo">

      <nav
        class="mobile-bottom-nav"
        role="navigation"
        aria-label="下部ナビゲーション"
      >
        <a
          class="nav-btn"
          href="index.html"
          data-key="home"
          aria-label="ホーム"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path d="M12 3 2 12h3v8h6v-5h2v5h6v-8h3z" />
          </svg>
          <span class="label">ホーム</span>
        </a>
        <a
          class="nav-btn"
          href="friends.html"
          data-key="friends"
          aria-label="フレンド"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V20h14v-3.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V20h6v-1.5C23 14.17 18.33 13 16 13z"
            />
          </svg>
          <span class="label">フレンド</span>
        </a>
        <a
          class="nav-btn"
          href="bookings.html"
          data-key="bookings"
          aria-label="予約"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path d="M7 10h5v5H7z" opacity=".9" />
            <path
              d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.89-1.99 2L3 21c0 1.1.89 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.11-.9-2-2-2zM19 21H5V8h14v13z"
            />
          </svg>
          <span class="label">予約</span>
        </a>
        <a
          class="nav-btn"
          href="profile.html"
          data-key="profile"
          aria-label="プロフィール"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"
            />
          </svg>
          <span class="label">プロフィール</span>
        </a>
      </nav>
    </footer>

    <script>
      // 年を自動挿入
      document.getElementById("year")?.textContent = new Date().getFullYear();

      // 現在のパスに応じて該当ボタンをアクティブ化
      (function () {
        const mapping = [
          { key: "home", paths: ["/", "/index.html"] },
          { key: "friends", paths: ["/friends.html", "/friends", "/friends/"] },
          {
            key: "bookings",
            paths: ["/bookings.html", "/bookings", "/bookings/", "/rides.html"],
          },
          {
            key: "profile",
            paths: ["/profile.html", "/profile", "/profile/", "/post.html"],
          },
        ];
        const pathname = location.pathname.replace(/\\/g, "/");
        const navBtns = document.querySelectorAll(
          ".mobile-bottom-nav a.nav-btn"
        );
        navBtns.forEach((btn) => btn.classList.remove("active"));
        let matched = false;
        mapping.forEach((m) => {
          m.paths.forEach((p) => {
            if (
              !matched &&
              (pathname.endsWith(p) ||
                pathname === p ||
                (p === "/" && (pathname === "" || pathname === "/")))
            ) {
              const el = document.querySelector(
                '.mobile-bottom-nav a.nav-btn[data-key="' + m.key + '"]'
              );
              if (el) {
                el.classList.add("active");
                el.setAttribute("aria-current", "page");
                matched = true;
              }
            }
          });
        });
        // デフォルトでホームがアクティブ
        if (!matched) {
          const homeEl = document.querySelector(
            '.mobile-bottom-nav a.nav-btn[data-key="home"]'
          );
          if (homeEl) homeEl.classList.add("active");
        }
      })();
    </script>
    <script defer src="friends.js"></script>
  </body>
</html>
