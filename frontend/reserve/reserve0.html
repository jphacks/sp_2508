<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>予約管理</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #f7f8fa;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #4b6cb7;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.3rem;
    }

    .tabs {
      display: flex;
      justify-content: center;
      background-color: white;
      border-bottom: 1px solid #ddd;
    }

    .tab {
      padding: 1rem 2rem;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .tab.active {
      border-bottom: 3px solid #4b6cb7;
      color: #4b6cb7;
      font-weight: bold;
    }

    .tab-content {
      display: none;
      padding: 2rem;
    }

    .tab-content.active {
      display: block;
    }

    .reservation-card {
      background: white;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .avatar {
      font-size: 2rem;
      margin-right: 1rem;
    }

    .reservation-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .datetime, .route {
      color: #555;
      margin-bottom: 0.3rem;
    }

    .pin {
      margin-right: 0.3rem;
    }

    .status {
      font-size: 0.9rem;
      color: #4b6cb7;
    }

    .button-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .move-button, .delete-button {
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: white;
    }

    .move-button {
      background-color: #4b6cb7;
    }

    .move-button:hover {
      background-color: #3c5aa6;
    }

    .delete-button {
      background-color: #e74c3c;
    }

    .delete-button:hover {
      background-color: #c0392b;
    }

    #reserveButton {
      display: block;
      width: 90%;
      max-width: 400px;
      margin: 2rem auto;
      background-color: #4b6cb7;
      color: white;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
    }

    #reserveModal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.3);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }

    .modal-content label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }

    .modal-content input {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .modal-buttons {
      text-align: right;
      margin-top: 1rem;
    }

    .modal-buttons button {
      margin-left: 0.5rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .cancel-btn {
      background-color: #ccc;
    }

    .submit-btn {
      background-color: #4b6cb7;
      color: white;
    }
  </style>
</head>
<body>
  <header>予約管理システム</header>

  <div class="tabs">
    <div class="tab active" data-tab="request">依頼</div>
    <div class="tab" data-tab="reserve">予約</div>
    <div class="tab" data-tab="done">完了</div>
    <div class="tab" data-tab="cancel">キャンセル</div>
  </div>

  <div id="request" class="tab-content active">
    <div id="requestList"><p>まだ依頼がありません。</p></div>
  </div>
  <div id="reserve" class="tab-content">
    <div id="reserveList"><p>まだ予約がありません。</p></div>
  </div>
  <div id="done" class="tab-content">
    <p>完了リストをここに表示します。</p>
  </div>
  <div id="cancel" class="tab-content">
    <p>キャンセルリストをここに表示します。</p>
  </div>

  <button id="reserveButton">＋ 新しい依頼を追加</button>

  <div id="reserveModal">
    <div class="modal-content">
      <form id="reserveForm">
        <h3>依頼を追加</h3>
        <label>ドライバー</label>
        <input type="text" id="driver" required />
        <label>日付</label>
        <input type="date" id="date" required />
        <label>時間</label>
        <input type="time" id="time" required />
        <label>出発地</label>
        <input type="text" id="from" required />
        <label>目的地</label>
        <input type="text" id="to" required />
        <div class="modal-buttons">
          <button type="button" class="cancel-btn" id="closeModal">キャンセル</button>
          <button type="submit" class="submit-btn">追加</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const tabs = document.querySelectorAll(".tab");
    const contents = document.querySelectorAll(".tab-content");

    const statusLabels = {
      request: "依頼",
      reserve: "予約",
      done: "完了",
      cancel: "キャンセル"
    };

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("active"));
        contents.forEach(c => c.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tab.dataset.tab).classList.add("active");
      });
    });

    const reserveButton = document.getElementById("reserveButton");
    const reserveModal = document.getElementById("reserveModal");
    const closeModal = document.getElementById("closeModal");
    const form = document.getElementById("reserveForm");

    reserveButton.addEventListener("click", () => {
      reserveModal.style.display = "flex";
    });
    closeModal.addEventListener("click", () => {
      reserveModal.style.display = "none";
      form.reset();
    });
    window.addEventListener("click", (e) => {
      if (e.target === reserveModal) {
        reserveModal.style.display = "none";
        form.reset();
      }
    });

    function loadReservations() {
      const reservations = JSON.parse(localStorage.getItem("reservations") || "[]");
      renderReservations(reservations);
    }

    function renderReservations(reservations) {
      const lists = {
        request: document.getElementById("requestList"),
        reserve: document.getElementById("reserveList")
      };
      Object.values(lists).forEach(list => list.innerHTML = "");

      for (const res of reservations) {
        const list = lists[res.status];
        if (!list) continue;

        const card = document.createElement("div");
        card.className = "reservation-card";
        card.innerHTML = `
          <div class="avatar">👤</div>
          <div class="reservation-content">
            <div class="reservation-header">
              <span>${res.driver}</span>
              <span class="status">${statusLabels[res.status]}</span>
            </div>
            <div class="datetime">${res.date}・${res.time}</div>
            <div class="route"><span class="pin">📍</span>${res.from} → ${res.to}</div>
          </div>
        `;

        const buttonGroup = document.createElement("div");
        buttonGroup.className = "button-group";

        if (res.status === "request") {
          const moveBtn = document.createElement("button");
          moveBtn.className = "move-button";
          moveBtn.textContent = "予約に移動";
          moveBtn.onclick = () => moveToReserve(res);
          buttonGroup.appendChild(moveBtn);
        }

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-button";
        deleteBtn.textContent = "削除";
        deleteBtn.onclick = () => deleteReservation(res);
        buttonGroup.appendChild(deleteBtn);

        card.appendChild(buttonGroup);
        list.appendChild(card);
      }
    }

    function saveReservations(reservations) {
      localStorage.setItem("reservations", JSON.stringify(reservations));
    }

    function moveToReserve(target) {
      const reservations = JSON.parse(localStorage.getItem("reservations") || "[]");
      const updated = reservations.map(r =>
        isSameReservation(r, target) ? { ...r, status: "reserve" } : r
      );
      saveReservations(updated);
      renderReservations(updated);
    }

    function deleteReservation(target) {
      const reservations = JSON.parse(localStorage.getItem("reservations") || "[]");
      const filtered = reservations.filter(r => !isSameReservation(r, target));
      saveReservations(filtered);
      renderReservations(filtered);
    }

    function isSameReservation(a, b) {
      return (
        a.driver === b.driver &&
        a.date === b.date &&
        a.time === b.time &&
        a.from === b.from &&
        a.to === b.to &&
        a.status === b.status
      );
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const newRes = {
        driver: document.getElementById("driver").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        from: document.getElementById("from").value,
        to: document.getElementById("to").value,
        status: "request"
      };
      const reservations = JSON.parse(localStorage.getItem("reservations") || "[]");
      reservations.push(newRes);
      saveReservations(reservations);
      renderReservations(reservations);
      reserveModal.style.display = "none";
      form.reset();
    });

    loadReservations();
  </script>
</body>
</html>
