<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <link rel="stylesheet" href="../main.css">
  <title>予約管理</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #f7f8fa;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #4bb74f;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.3rem;
    }

    #userInfo {
      text-align: center;
      padding: 0.5rem;
      background: #ffffff;
      font-size: 0.95rem;
      color: #333;
      border-bottom: 1px solid #ddd;
    }

    .tabs {
      display: flex;
      justify-content: center;
      background-color: white;
      border-bottom: 1px solid #ddd;
    }

    .tab {
      padding: 1rem 2rem;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .tab.active {
      border-bottom: 3px solid #4bb752;
      color: #3eb165;
      font-weight: bold;
    }

    .tab-content {
      display: none;
      padding: 2rem;
    }

    .tab-content.active {
      display: block;
    }

    .reservation-card {
      background: white;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .reservation-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .datetime, .route {
      color: #555;
      margin-bottom: 0.3rem;
    }

    .status {
      font-size: 0.9rem;
      color: #4bb754;
    }

    .button-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .move-button, .delete-button {
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: white;
    }

    .move-button {
      background-color: #4bb766;
    }

    .move-button:hover {
      background-color: #3ca676;
    }

    .delete-button {
      background-color: #e74c3c;
    }

    .delete-button:hover {
      background-color: #c0392b;
    }

    #reserveButton {
      display: block;
      width: 90%;
      max-width: 400px;
      margin: 1.5rem auto 1rem auto;
      background-color: #4bb762;
      color: white;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
    }

    #reserveModal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.3);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
    }

    .modal-content label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }

    .modal-content input {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .modal-buttons {
      text-align: right;
      margin-top: 1rem;
    }

    .modal-buttons button {
      margin-left: 0.5rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .cancel-btn {
      background-color: #ccc;
    }

    .submit-btn {
      background-color: #4bb771;
      color: white;
    }

    .reque{
      font-size: 1.2rem;
      margin-left: 7px;
    }

    .rese{
      font-size: 1.2rem;
      margin-left: 7px;
    }

    .ok{
      font-size: 1.2rem;
      margin-left: 7px;
    }

    .can{
      font-size: 1.2rem;
      margin-left: 30px;
    }

    .reservation-card{
       padding: 0.4em 0.5em;/*文字の上下 左右の余白*/
        color: #494949;/*文字色*/
        background: #f4f4f4;/*背景色*/
        border-left: solid 5px #16841d;/*左線*/
        border-bottom: solid 3px #d7d7d7;/*下線*/
    }

  </style>
</head>
<body>
  <header>予約管理システム</header>

  <div id="userInfo">ユーザー情報を読み込み中...</div>

  <div class="tabs">
    <div class="tab active" data-tab="request"><spnn class="reque">🚗</spnn><br>依頼</div>
    <div class="tab" data-tab="reserve"><spnn class="rese">📃</spnn><br>予約</div>
    <div class="tab" data-tab="done"><spnn class="ok">✅</spnn><br>完了</div>
    <div class="tab" data-tab="cancel"><spnn class="can">✖️</spnn><br>キャンセル</div>
  </div>

  <button id="reserveButton">＋ 新しい依頼を追加</button>

  <div id="request" class="tab-content active">
    <div id="requestList"><p>まだ依頼がありません。</p></div>
  </div>
  <div id="reserve" class="tab-content">
    <div id="reserveList"><p>まだ予約がありません。</p></div>
  </div>
  <div id="done" class="tab-content">
    <p>完了リストをここに表示します。</p>
  </div>
  <div id="cancel" class="tab-content">
    <p>キャンセルリストをここに表示します。</p>
  </div>

  <div id="reserveModal">
    <div class="modal-content">
      <form id="reserveForm">
        <h3>依頼を追加</h3>
        <label>依頼主</label>
        <input type="text" id="requester" required />
        <label>ドライバー</label>
        <input type="text" id="driver" required />
        <label>日付</label>
        <input type="date" id="date" required />
        <label>時間</label>
        <input type="time" id="time" required />
        <label>出発地</label>
        <input type="text" id="from" required />
        <label>目的地</label>
        <input type="text" id="to" required />
        <div class="modal-buttons">
          <button type="button" class="cancel-btn" id="closeModal">キャンセル</button>
          <button type="submit" class="submit-btn">追加</button>
        </div>
      </form>
    </div>
  </div>

  
    <!-- 共通フッター（下部スマホナビに置き換え） -->
    <footer id="site-footer" role="contentinfo">

      <nav
        class="mobile-bottom-nav"
        role="navigation"
        aria-label="下部ナビゲーション"
      >
        <a
          class="nav-btn"
          href="../home/home.html"
          data-key="home"
          aria-label="ホーム"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path d="M12 3 2 12h3v8h6v-5h2v5h6v-8h3z" />
          </svg>
          <span class="label">ホーム</span>
        </a>
        <a
          class="nav-btn"
          href="../friends/friends.html"
          data-key="friends"
          aria-label="フレンド"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V20h14v-3.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V20h6v-1.5C23 14.17 18.33 13 16 13z"
            />
          </svg>
          <span class="label">フレンド</span>
        </a>
        <a
          class="nav-btn"
          href="../reserve/reserve.html"
          data-key="bookings"
          aria-label="予約"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path d="M7 10h5v5H7z" opacity=".9" />
            <path
              d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.89-1.99 2L3 21c0 1.1.89 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.11-.9-2-2-2zM19 21H5V8h14v13z"
            />
          </svg>
          <span class="label">予約</span>
        </a>
        <a
          class="nav-btn"
          href="../profile/profile.html"
          data-key="profile"
          aria-label="プロフィール"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"
            />
          </svg>
          <span class="label">プロフィール</span>
        </a>
      </nav>
    </footer>

  <script>
    // --- ユーザー情報 ---
    const profile = JSON.parse(localStorage.getItem("userProfile") || "null");
    let name = "未設定";
    let userId = "";
    const userInfoDiv = document.getElementById("userInfo");

    if (profile && profile.name && profile.id) {
      name = profile.name;
      userId = profile.id;
      userInfoDiv.textContent = `ようこそ、${name} さん（ID: ${userId}）`;
    } else {
      userInfoDiv.textContent = "ユーザー情報が見つかりません。ログインページで登録してください。";
    }

    // --- タブ切替 ---
    const tabs = document.querySelectorAll(".tab");
    const contents = document.querySelectorAll(".tab-content");

    const statusLabels = {
      request: "依頼",
      reserve: "予約",
      done: "完了",
      cancel: "キャンセル"
    };

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("active"));
        contents.forEach(c => c.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tab.dataset.tab).classList.add("active");
      });
    });

    // --- モーダル処理 ---
    const reserveButton = document.getElementById("reserveButton");
    const reserveModal = document.getElementById("reserveModal");
    const closeModal = document.getElementById("closeModal");
    const form = document.getElementById("reserveForm");

    reserveButton.addEventListener("click", () => {
      reserveModal.style.display = "flex";
    });
    closeModal.addEventListener("click", () => {
      reserveModal.style.display = "none";
      form.reset();
    });
    window.addEventListener("click", (e) => {
      if (e.target === reserveModal) {
        reserveModal.style.display = "none";
        form.reset();
      }
    });

    // --- データ表示 ---
    function loadReservations() {
      const reservations = JSON.parse(localStorage.getItem("reservations") || "[]");
      renderReservations(reservations);
    }

    function renderReservations(reservations) {
      const lists = {
        request: document.getElementById("requestList"),
        reserve: document.getElementById("reserveList"),
        done: document.getElementById("done"),
        cancel: document.getElementById("cancel")
      };
      Object.values(lists).forEach(list => list.innerHTML = "");

      // ✅ ログインユーザーに関係ある予約だけ表示
      const filtered = reservations.filter(res =>
        res.requester === name || res.driver === name
      );

      for (const res of filtered) {
        const list = lists[res.status];
        if (!list) continue;

        const card = document.createElement("div");
        card.className = "reservation-card";
        card.innerHTML = `
          <div class="reservation-header">
            <span>${res.requester} → ${res.driver}</span>
            <span class="status">${statusLabels[res.status]}</span>
          </div>
          <div class="datetime">${res.date}・${res.time}</div>
          <div class="route">📍 ${res.from} → ${res.to}</div>
        `;

        if (res.driver === name) {
          const buttonGroup = document.createElement("div");
          buttonGroup.className = "button-group";

          if (res.status === "request") {
            const moveBtn = document.createElement("button");
            moveBtn.className = "move-button";
            moveBtn.textContent = "予約に移動";
            moveBtn.onclick = () => moveToReserve(res);
            buttonGroup.appendChild(moveBtn);
          }

          if (res.status === "reserve") {
            const doneBtn = document.createElement("button");
            doneBtn.className = "move-button";
            doneBtn.textContent = "完了";
            doneBtn.onclick = () => moveToDone(res);
            buttonGroup.appendChild(doneBtn);
          }

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "delete-button";
          deleteBtn.textContent = "削除";
          deleteBtn.onclick = () => deleteReservation(res);
          buttonGroup.appendChild(deleteBtn);

          card.appendChild(buttonGroup);
        }

        list.appendChild(card);
      }

      if (lists.request.innerHTML === "") lists.request.innerHTML = "<p>まだ依頼がありません。</p>";
      if (lists.reserve.innerHTML === "") lists.reserve.innerHTML = "<p>まだ予約がありません。</p>";
      if (lists.done.innerHTML === "") lists.done.innerHTML = "<p>完了リストをここに表示します。</p>";
      if (lists.cancel.innerHTML === "") lists.cancel.innerHTML = "<p>キャンセルリストをここに表示します。</p>";
    }

    // --- 保存・削除・移動処理 ---
    function saveReservations(reservations) {
      localStorage.setItem("reservations", JSON.stringify(reservations));
    }

    function moveToReserve(target) {
      const reservations = JSON.parse(localStorage.getItem("reservations") || "[]");
      const updated = reservations.map(r =>
        isSameReservation(r, target) ? { ...r, status: "reserve" } : r
      );
      saveReservations(updated);
      renderReservations(updated);
    }

    function moveToDone(target) {
      const reservations = JSON.parse(localStorage.getItem("reservations") || "[]");
      const updated = reservations.map(r =>
        isSameReservation(r, target) ? { ...r, status: "done" } : r
      );
      saveReservations(updated);
      renderReservations(updated);
    }

    function deleteReservation(target) {
      const reservations = JSON.parse(localStorage.getItem("reservations") || "[]");
      const filtered = reservations.filter(r => !isSameReservation(r, target));
      saveReservations(filtered);
      renderReservations(filtered);
    }

    function isSameReservation(a, b) {
      return (
        a.requester === b.requester &&
        a.driver === b.driver &&
        a.date === b.date &&
        a.time === b.time &&
        a.from === b.from &&
        a.to === b.to &&
        a.status === b.status
      );
    }

    // --- フォーム送信 ---
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const newRes = {
        requester: document.getElementById("requester").value,
        driver: document.getElementById("driver").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        from: document.getElementById("from").value,
        to: document.getElementById("to").value,
        status: "request"
      };
      const reservations = JSON.parse(localStorage.getItem("reservations") || "[]");
      reservations.push(newRes);
      saveReservations(reservations);
      renderReservations(reservations);
      reserveModal.style.display = "none";
      form.reset();
    });

    loadReservations();
  </script>
</body>
</html>
